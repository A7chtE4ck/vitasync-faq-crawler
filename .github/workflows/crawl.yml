name: FAQ crawlen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python crawl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faqs
          path: |
            faqs.json
            report.json
      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "faq-bot"
          git config user.email "faq-bot@users.noreply.github.com"
          git add faqs.json report.json
          git commit -m "FAQ-Crawl Ergebnis" || echo "nichts zu committen"
          git push
